<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed layouts</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px 24px; background: #f8fafc; color: #0f172a; min-height: 200vh; }
    nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    nav a { color: #2563eb; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; font-size: 12px; }
    form label { display: flex; flex-direction: column; gap: 2px; }
    form input { font: inherit; padding: 4px 6px; width: 280px; max-width: 100%; }
    h1 { font-size: 20px; margin: 12px 0 4px; }
    .note { margin: 4px 0 12px; color: #334155; max-width: 640px; }
    .warn { color: #b91c1c; }
    pre { background: #e2e8f0; padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 640px; white-space: pre-wrap; }
    ol { columns: 2; max-width: 640px; }
    .filler { color: #94a3b8; max-width: 640px; }
  </style>
</head>
<body>
  <!--
    Gallery of embed configurations for checking the widget across layouts.
    With `yarn dev` running, open http://localhost:3080/layouts/ and enter an
    embed ID from your AnythingLLM instance. Add a layout by adding an entry to
    LAYOUTS below; every data-* option is listed in the README.
  -->
  <form id="config">
    <label>Embed ID <input name="embedId" required placeholder="UUID of a chat embed" /></label>
    <label>API base URL <input name="baseApiUrl" required /></label>
    <label>Widget script <input name="widgetSrc" required /></label>
    <button type="submit">Apply</button>
  </form>
  <nav id="nav"></nav>
  <h1 id="title"></h1>
  <p class="note" id="note"></p>
  <pre id="attrs"></pre>
  <ol id="list"></ol>
  <p class="filler">Host page filler text so the page scrolls behind the widget.</p>
  <script>
    const STORAGE_KEY = "allm_layouts_config";
    const DEFAULT_CONFIG = {
      embedId: "",
      baseApiUrl: "http://localhost:3001/api/embed",
      widgetSrc: "/dist/anythingllm-chat-widget.js",
    };
    const asset = (file) => new URL(file, location.href).toString();

    // [name, what the layout sets up, data-* attributes without the data- prefix]
    const LAYOUTS = [
      ["default", "No options beyond opening on load.", { "open-on-load": "on" }],
      ["closed-button", "Starts closed, with a custom button color and chat icon.", { "chat-icon": "support", "button-color": "#7c3aed" }],
      ["bottom-left", "Anchored bottom-left.", { "open-on-load": "on", position: "bottom-left" }],
      ["top-right", "Anchored top-right.", { "open-on-load": "on", position: "top-right" }],
      ["top-left", "Anchored top-left.", { "open-on-load": "on", position: "top-left" }],
      ["no-header", "Header hidden.", { "open-on-load": "on", "no-header": "true" }],
      ["dark-colors", "Dark user and assistant colors, with suggested messages.", { "open-on-load": "on", "user-bg-color": "#7c3aed", "assistant-bg-color": "#0f766e", "button-color": "#7c3aed", "default-messages": "What can you do?, Tell me a joke" }],
      ["light-colors", "Light user and assistant colors, with suggested messages.", { "open-on-load": "on", "user-bg-color": "#fde047", "assistant-bg-color": "#e0f2fe", "default-messages": "What can you do?, Tell me a joke" }],
      ["short-hex", "3-digit hex colors.", { "open-on-load": "on", "user-bg-color": "#f80", "assistant-bg-color": "#def" }],
      ["white-label", "Brand image, custom assistant name and icon, no sponsor.", { "open-on-load": "on", "brand-image-url": asset("brand-logo.svg"), "assistant-icon": asset("assistant-icon.svg"), "assistant-name": "Acme Helper", "no-sponsor": "true" }],
      ["brand-only", "Brand image without an assistant icon.", { "open-on-load": "on", "brand-image-url": asset("brand-logo.svg") }],
      ["sponsor-support", "Custom sponsor text and link, and a support email in the options menu.", { "open-on-load": "on", "sponsor-text": "Powered by Acme", "sponsor-link": "https://example.com", "support-email": "support@example.com" }],
      ["greeting-suggestions", "Custom greeting and suggested messages. Reset the chat to see the empty state.", { "open-on-load": "on", greeting: "Hi! Ask me anything about Acme.", "default-messages": "What is Acme?, How do I get started?, A much longer suggested message that should wrap onto a second line cleanly" }],
      ["text-overrides", "Custom input placeholder and reset chat text.", { "open-on-load": "on", "send-message-text": "Ask Acme...", "reset-chat-text": "Start over" }],
      ["text-size-18", "Message text size of 18px.", { "open-on-load": "on", "text-size": "18" }],
      ["small-window", "300px by 420px window.", { "open-on-load": "on", "window-width": "300px", "window-height": "420px" }],
      ["large-window", "640px by 90% window.", { "open-on-load": "on", "window-width": "640px", "window-height": "90%" }],
      ["show-thoughts", "Thoughts shown. Needs a reasoning model on the embed's workspace.", { "open-on-load": "on", "show-thoughts": "true" }],
      ["language-es", "Spanish interface.", { "open-on-load": "on", language: "es" }],
      ["kitchen-sink", "Most options at once, anchored bottom-left.", { "open-on-load": "on", position: "bottom-left", "brand-image-url": asset("brand-logo.svg"), "assistant-icon": asset("assistant-icon.svg"), "assistant-name": "Acme Helper", "user-bg-color": "#7c3aed", "assistant-bg-color": "#f1f5f9", "button-color": "#7c3aed", "chat-icon": "magic", "support-email": "support@example.com", "sponsor-text": "Powered by Acme", "sponsor-link": "https://example.com", greeting: "Hi! Ask me anything about Acme.", "default-messages": "What is Acme?, How do I get started?", "show-thoughts": "true", "window-width": "420px", "window-height": "640px" }],
    ];

    function loadConfig() {
      try {
        return { ...DEFAULT_CONFIG, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") };
      } catch {
        return { ...DEFAULT_CONFIG };
      }
    }

    const config = loadConfig();
    const form = document.getElementById("config");
    for (const [key, value] of Object.entries(config)) form.elements[key].value = value;
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const updated = Object.fromEntries(new FormData(form));
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
      } catch {}
      location.reload();
    });

    const names = LAYOUTS.map((layout) => layout[0]);
    const requested = new URLSearchParams(location.search).get("layout");
    const index = Math.max(0, names.indexOf(requested));
    const [name, note, attrs] = LAYOUTS[index];
    const prev = names[(index - 1 + names.length) % names.length];
    const next = names[(index + 1) % names.length];

    document.title = `${index + 1}. ${name}`;
    document.getElementById("nav").innerHTML =
      `<a href="?layout=${prev}">&larr; ${prev}</a><strong>${index + 1} / ${names.length}</strong><a href="?layout=${next}">${next} &rarr;</a>`;
    document.getElementById("title").textContent = `${index + 1}. ${name}`;
    document.getElementById("attrs").textContent = Object.entries(attrs)
      .map(([key, value]) => `data-${key}="${value}"`)
      .join("\n");
    document.getElementById("list").innerHTML = names
      .map((n) => `<li><a href="?layout=${n}">${n}</a></li>`)
      .join("");

    const noteEl = document.getElementById("note");
    noteEl.textContent = note;
    if (!config.embedId) {
      noteEl.textContent = "Enter an embed ID above to load the widget.";
      noteEl.className = "note warn";
    } else {
      // The widget reopens if it was left open, which would hide the closed state
      // of layouts that don't open on load.
      if (attrs["open-on-load"] !== "on") {
        try {
          localStorage.removeItem("___anythingllm-chat-widget-open___");
        } catch {}
      }

      // The widget reads its settings from its own script tag, so each layout gets a fresh tag.
      const script = document.createElement("script");
      script.setAttribute("data-embed-id", config.embedId);
      script.setAttribute("data-base-api-url", config.baseApiUrl);
      for (const [key, value] of Object.entries(attrs)) script.setAttribute(`data-${key}`, value);
      script.src = config.widgetSrc;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
